    body.dark-mode {

    /* Frosty page, soft snow dots and snowy bottom edge. */
    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 15%, rgb(255 255 255 / 85%) 0 2px, transparent 3px),
        radial-gradient(circle at 91% 23%, rgb(255 255 255 / 78%) 0 3px, transparent 4px),
        radial-gradient(circle at 16% 78%, rgb(255 255 255 / 68%) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 70%, rgb(255 255 255 / 74%) 0 2px, transparent 3px),
        linear-gradient(145deg, var(--page), var(--page-deep));
      color: var(--navy);
      font-family: "Nunito", sans-serif;
      transition: background 180ms ease, color 180ms ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      box-shadow: inset 0 0 90px rgb(255 255 255 / 50%);
    }
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      left: -5vw;
      right: -5vw;
      bottom: -30px;
      height: 75px;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, rgb(255 255 255 / 96%), rgb(212 240 255 / 92%));
      box-shadow: 0 -8px 26px rgb(255 255 255 / 62%);
      pointer-events: none;
    }
    body.dark-mode::before { box-shadow: inset 0 0 100px rgb(25 195 255 / 9%); }
    body.dark-mode::after { background: linear-gradient(180deg, #173652, #102740); }
    main { position: relative; z-index: 1; width: min(100%, 440px); text-align: center; }

    /* Bubbly title with layered ice letters and decorative melt drops. */
    h1 {
